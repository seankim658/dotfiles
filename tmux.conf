if-shell 'test -x /opt/homebrew/bin/bash' 'set -g default-shell /opt/homebrew/bin/bash'
set -g mouse on
setw -g mode-keys vi
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Set the clipboard tool once per OS; copy-pipe bindings with no argument use it
if-shell 'uname | grep -q Darwin' \
  'set -g set-clipboard on; set -s copy-command "pbcopy"' \
  'set -s copy-command "xclip -selection clipboard"'
bind P paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind l switch-client -l
bind L last-window
bind w choose-tree -F "#{window_name}"
set-option -g focus-events on
